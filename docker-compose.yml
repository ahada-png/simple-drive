# Local S3-compatible server (moto) and FTP server for trying the non-local backends.
# (MinIO's public Docker images were withdrawn in 2026, so moto is used for S3.)
#   docker compose up -d
services:
  s3:
    image: motoserver/moto:latest
    ports:
      - "5000:5000"

  # Creates the "simple-drive" bucket once the S3 server is up.
  s3-setup:
    image: amazon/aws-cli
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://s3:5000 s3api list-buckets > /dev/null; do sleep 1; done;
      aws --endpoint-url http://s3:5000 s3 mb s3://simple-drive || true
      "

  ftp:
    image: delfer/alpine-ftp-server
    environment:
      USERS: "drive|drivepass|/home/drive"
      ADDRESS: localhost
    ports:
      - "21:21"
      - "21000-21010:21000-21010" # passive mode ports
