# Local S3 (MinIO) and FTP servers for trying the non-local backends.
#   docker compose up -d
services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data

  # Creates the "simple-drive" bucket once MinIO is up.
  minio-setup:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/simple-drive
      "

  ftp:
    image: delfer/alpine-ftp-server
    environment:
      USERS: "drive|drivepass|/home/drive"
      ADDRESS: localhost
    ports:
      - "21:21"
      - "21000-21010:21000-21010" # passive mode ports

volumes:
  minio-data:
